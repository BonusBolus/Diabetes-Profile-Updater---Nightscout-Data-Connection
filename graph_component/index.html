<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}
</style></head><body><iframe id="graphs" title="Health graphs" allow="fullscreen" allowfullscreen></iframe><script>
const frame=document.getElementById('graphs');let html='',restore=null;
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function restoreGraph(){if(restore)frame.contentWindow.postMessage({type:'profile-studio:restore-graph',request:restore},'*');}
frame.addEventListener('load',restoreGraph);
window.addEventListener('message',event=>{
  if(event.source===window.parent && event.data?.type==='streamlit:render'){
    const args=event.data.args;
    restore=args.restore_graph;
    document.body.style.height=args.height+'px';
    if(args.html!==html){html=args.html;frame.srcdoc=html;}else restoreGraph();
    send('streamlit:setFrameHeight',{height:args.height});
  }
  if(event.source===frame.contentWindow && ['profile-studio:save','profile-studio:report','profile-studio:graph-visibility'].includes(event.data?.type)){
    send('streamlit:setComponentValue',{value:event.data.request,dataType:'json'});
  }
});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
